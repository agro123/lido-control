# Compila Lido Control para Windows (instalador NSIS .exe)
# sin necesidad de tener Windows en local.
#
# Cómo usarlo:
# 1. Push a main / master, o
# 2. Actions → "Build Windows" → Run workflow
#
# El instalador se descarga en Actions → run → Artifacts.

name: Build Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (Windows NSIS)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis
          uploadUpdaterJson: false

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: lido-control-windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
